name: Build & Release

on:
  push:
    branches:
      - main

jobs:
  build-and-version:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch all tags
        run: git fetch --tags origin

      - name: Calculate next version
        id: semver
        uses: paulhatch/semantic-version@v5.4.0
        with:
          tag_prefix: "v"
          branch: main
          major_pattern: "major!"
          minor_pattern: "minor!"
          bump_each_commit: false
          version_format: "${major}.${minor}.${patch}"

      - name: Show next version
        run: echo "Next version will be v${{ steps.semver.outputs.version }}"

      - name: Build
        run: |
          echo "Building app..."

      - name: Create Git tag
        if: success()
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git tag v${{ steps.semver.outputs.version }}
          git push origin v${{ steps.semver.outputs.version }}

      - name: Done
        run: echo "Released version v${{ steps.semver.outputs.version }}"
