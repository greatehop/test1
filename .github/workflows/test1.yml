name: Build & Release

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # REQUIRED for tags

      - name: Calculate version
        id: semver
        uses: paulhatch/semantic-version@v5.4.0
        with:
          tag_prefix: "v"
          branch: main
          major_pattern: "major"
          minor_pattern: "minor"
          bump_each_commit: true
          version_format: "${major}.${minor}.${patch}"

      - name: Show calculated version
        run: |
          echo "Next version: v${{ steps.semver.outputs.version }}"

      - name: Build
        run: |
          echo "Building app..."
          # your real build here
          # example:
          # go build ./...

      - name: Create Git tag
        if: success()
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git tag v${{ steps.semver.outputs.version }}
          git push origin v${{ steps.semver.outputs.version }}

      - name: Done
        run: echo "Released v${{ steps.semver.outputs.version }}"
